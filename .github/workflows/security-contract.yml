name: Security contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js && node --check scripts/check-security-contract.mjs
      - name: Check explicit role and private-note contract
        run: node scripts/check-security-contract.mjs
